# Render Blueprint — AegisOne Slice 2
# Deploy via https://dashboard.render.com/blueprints → New Blueprint Instance → paste repo URL.
#
# Strategy: deploy ONLY the web service from the Blueprint. Postgres and Redis
# are created manually in the Render dashboard (their free tier GUI doesn't
# accept them in Blueprints reliably), and DATABASE_URL / REDIS_URL are
# pasted into the web service's environment after the fact.
#
# The web service uses the native python runtime (Render's free plan does
# not allow runtime: docker).

services:
  - type: web
    name: aegisone-backend
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: bash start.sh
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: APP_PORT
        value: "8000"
      - key: PYTHON_VERSION
        value: "3.12.7"
      # DATABASE_URL and REDIS_URL must be set manually after creating
      # aegisone-postgres + aegisone-redis in the Render dashboard.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: TRUSTED_PROXIES
        value: 0.0.0.0/0
      - key: RATE_LIMIT_LOGIN_PER_MIN
        value: "5"
      - key: RATE_LIMIT_LOGIN_PER_EMAIL_PER_MIN
        value: "10"
      - key: RATE_LIMIT_REGISTER_PER_HOUR
        value: "3"
      # CORS_ORIGINS is set manually AFTER the Vercel deploy.
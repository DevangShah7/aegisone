services:
  - type: web
    name: aegisone-backend-devshah
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: bash start.sh
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: APP_PORT
        value: "8000"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: TRUSTED_PROXIES
        value: 0.0.0.0/0
      - key: RATE_LIMIT_LOGIN_PER_MIN
        value: "5"
      - key: RATE_LIMIT_LOGIN_PER_EMAIL_PER_MIN
        value: "10"
      - key: RATE_LIMIT_REGISTER_PER_HOUR
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Pre-fill with the canonical Vercel dashboard hostname so the
      # backend boots with a working CORS allow-list out of the box.
      # The dashboard is also deployed at a generated *-vercel.app URL
      # (dashboard-kappa-six-97.vercel.app), so the list is a
      # comma-separated allow-list. Replace if you move the dashboard.
      - key: CORS_ORIGINS
        value: https://dashboard-kappa-six-97.vercel.app

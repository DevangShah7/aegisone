# Render Blueprint — AegisOne Slice 2
# Deploy via https://dashboard.render.com/blueprints → New Blueprint Instance → paste repo URL.
# Renders: 1 web service (backend) + 1 managed Postgres + 1 managed Redis.
# Free tier: web service sleeps after 15 min idle; use cron-job.org keepalive (see DEPLOY.md).

services:
  - type: pserv
    name: aegisone-postgres
    plan: free
    runtime: postgresql
    databaseName: aegisone
    databaseUser: aegisone
    # Postgres free plan expires after 90 days; back up before then.
    # Note: connectionString is auto-bound to DATABASE_URL on linked services.

  - type: redis
    name: aegisone-redis
    plan: free
    # Redis free plan = 25 MB, no expiry. connectionString auto-bound to REDIS_URL.

  - type: web
    name: aegisone-backend
    plan: free
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    startCommand: bash start.sh
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: APP_PORT
        value: "8000"
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: aegisone-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: aegisone-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: TRUSTED_PROXIES
        value: 0.0.0.0/0
      - key: RATE_LIMIT_LOGIN_PER_MIN
        value: "5"
      - key: RATE_LIMIT_LOGIN_PER_EMAIL_PER_MIN
        value: "10"
      - key: RATE_LIMIT_REGISTER_PER_HOUR
        value: "3"
      # CORS_ORIGINS is set manually in the Render dashboard AFTER the
      # Vercel deploy, once the dashboard URL is known.

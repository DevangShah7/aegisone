[project]
name = "aegisone-backend"
version = "0.1.0"
description = "AegisOne backend — Secure Remote Device Management. Developed by Devang Shah."
# No `readme = ...` field on purpose: pointing at ../README.md confuses
# setuptools (it refuses paths outside the package directory). The root
# README.md is the canonical project document and is referenced from
# /about via settings anyway.
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Devang Shah" }]
keywords = ["aegisone", "device-management", "security", "remote-support"]

dependencies = [
    # Web framework
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.40",
    # Validation
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.5,<3",
    "email-validator>=2.2,<3",
    # Database — psycopg (v3) ships prebuilt wheels on Windows; asyncpg would
    # require a C compiler we cannot assume on developer machines.
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.13,<2",
    # Auth
    "PyJWT>=2.9,<3",
    "argon2-cffi>=23.1,<24",
    # Redis
    "redis[hiredis]>=5.0,<6",
    # Object storage (S3-compatible)
    "boto3>=1.34,<2",
    # HTTP client (used for tests + outbound)
    "httpx>=0.27,<0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-redis>=4.6,<5",
    "pip-audit>=2.7,<3",
    "freezegun>=1.5,<2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "PT", "RET", "SIM"]
ignore = [
    "E501",  # line length — handled by formatter
    "S101",  # `assert` is fine in tests
    "B008",  # function-call-in-default-arg is required for FastAPI Depends
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PT004", "PT011", "PT018"]
"alembic/*" = ["E", "F"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --tb=short --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:jwt.*",
    # FastAPI 0.115 calls asyncio.iscoroutinefunction which Python 3.14
    # marks as deprecated. Upstream fix lands in FastAPI 0.117; until
    # then, ignore the warning so the test runner completes.
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
    # pytest-asyncio reads the event-loop policy at fixture setup; that
    # policy API is deprecated in 3.14 but still functional. Filter so
    # the test runner can complete.
    "ignore:.*asyncio.get_event_loop_policy.*:DeprecationWarning",
    "ignore:.*asyncio.set_event_loop_policy.*:DeprecationWarning",
    "ignore:.*asyncio.DefaultEventLoopPolicy.*:DeprecationWarning",
    "ignore:.*asyncio.WindowsSelectorEventLoopPolicy.*:DeprecationWarning",
    # starlette's TestClient wants `httpx2`, which is not yet a published
    # PyPI release. Until starlette ships a fallback, ignore the warning
    # (it subclasses UserWarning, not DeprecationWarning).
    "ignore:.*httpx.*deprecated.*install .httpx2.:UserWarning",
    # The async DB engine and its connection pool schedule socket cleanup
    # on the asyncio event loop. When the test session ends before the
    # loop has fully drained those close callbacks, Python prints a
    # ResourceWarning. The engine is properly disposed by
    # ``_dispose_engine_at_session_end``; the lingering sockets are
    # from the connection pool's own teardown. Surfacing them as
    # warnings-as-errors makes the tests flaky on Windows where the
    # GC sweep is non-deterministic.
    "ignore:unclosed event loop.*:ResourceWarning",
    "ignore:unclosed <socket.*:ResourceWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
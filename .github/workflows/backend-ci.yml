name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "scripts/export-openapi.py"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "scripts/export-openapi.py"

permissions:
  contents: read

jobs:
  backend:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegisone_test
          POSTGRES_USER: aegisone
          POSTGRES_PASSWORD: aegisone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql+psycopg://aegisone:aegisone_test@localhost:5432/aegisone_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci_only_secret_value_at_least_32_chars_long' }}
      JWT_REFRESH_SECRET_KEY: ${{ secrets.JWT_REFRESH_SECRET_KEY || 'ci_only_refresh_secret_value_at_least_32_chars_long' }}
      JWT_ALGORITHM: HS256
      CORS_ORIGINS: http://localhost:3000
      TRUSTED_PROXIES: 127.0.0.1/32

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        working-directory: backend
        run: mypy app/

      - name: Test (pytest + coverage gate)
        working-directory: backend
        run: |
          pytest --cov=app --cov-fail-under=70

      - name: Dependency audit (pip-audit)
        working-directory: backend
        run: pip-audit -r <(pip show 2>/dev/null | awk '/^Name:/{n=$2} /^Version:/{print n"=="$2}' | grep -E '^(fastapi|pydantic|sqlalchemy|alembic|pyjwt|argon2-cffi|redis|asyncpg|httpx|uvicorn|email-validator|jwt|pydantic-settings)==' || true)

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U aegisone; do sleep 1; done

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Smoke test the FastAPI app
        working-directory: backend
        run: |
          python -c "from app.main import app; print(app.title, app.version)"

      - name: Export OpenAPI artifact
        run: |
          python scripts/export-openapi.py
          # Drift detection: fail the build if the just-written file does
          # not match what ``--check`` would accept. Catches cases where a
          # contributor regenerates but forgets to commit the diff.
          python scripts/export-openapi.py --check
          if [[ -n "$GITHUB_BASE_REF" ]]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1
            if ! git diff --quiet origin/$GITHUB_BASE_REF -- contracts/openapi.json; then
              echo "WARNING: contracts/openapi.json changed. Commit the diff to keep dashboards and Android in sync."
            fi
          fi

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: contracts/openapi.json

  docker-smoke:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        working-directory: backend
        run: docker build -t aegisone-backend:ci .
      - name: Smoke test
        run: |
          docker run --rm -d --name aegisone-backend-smoke aegisone-backend:ci
          sleep 5
          docker logs aegisone-backend-smoke
          docker rm -f aegisone-backend-smoke